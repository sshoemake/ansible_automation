---

- hosts: all
  become: true
  pre_tasks:

  - name: install updates (Ubuntu)
    tags: always
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_facts["distribution"] == "Ubuntu"

  - name: copy default html file for site
    tags: apache,apache2
    copy:
      src: files/default_site.html
      dest: /var/www/html/index_2.html 
      owner: root
      group: root
      mode: '0644'