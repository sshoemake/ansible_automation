---
- name: Install Docker on Ubuntu (production-ready)
  hosts: all
  become: true

  vars:
    docker_apt_arch_map:
      x86_64: amd64
      aarch64: arm64

    docker_apt_arch: "{{ docker_apt_arch_map.get(ansible_facts['architecture'], 'amd64') }}"

    docker_supported_releases:
      - focal
      - jammy

    docker_ubuntu_release: >-
      {{ ansible_facts['distribution_release']
        if ansible_facts['distribution_release'] in docker_supported_releases
        else 'jammy' }}

  tasks:
    - name: Install base dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Install Docker GPG key (dearmored)
      ansible.builtin.shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
        | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_apt_arch }}
          signed-by=/etc/apt/keyrings/docker.gpg]
          https://download.docker.com/linux/ubuntu
          {{ docker_ubuntu_release }} stable
        filename: docker
        state: present

    - name: Update apt cache (force refresh)
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker is running and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add user to docker group
      ansible.builtin.user:
        name: odroid
        groups: docker
        append: true